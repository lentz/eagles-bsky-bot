name: "Post to Bluesky"

on:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mirror Eagles
        id: eagles
        run: npm start
        env:
          BSKY_HANDLE: eagles-bot.bsky.social
          BSKY_PASSWORD: ${{ secrets.EAGLES_BSKY_PASSWORD }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          LAST_MASTODON_ID: ${{ vars.EAGLES_LAST_MASTODON_ID }}
          MASTODON_HANDLE: eagles@sportsbots.xyz
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_LIMIT: ${{ vars.POST_LIMIT }}
      - name: Save last Mastodon ID
        if: always() && steps.eagles.outputs.last_mastodon_id != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LAST_MASTODON_ID: ${{ steps.eagles.outputs.last_mastodon_id }}
        run: gh variable set EAGLES_LAST_MASTODON_ID --body "$LAST_MASTODON_ID" --repo "$GITHUB_REPOSITORY"
      - name: Mirror Jeff
        id: jeff
        run: npm start
        env:
          BSKY_HANDLE: jeff-mclane-bot.bsky.social
          BSKY_PASSWORD: ${{ secrets.JEFF_BSKY_PASSWORD }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          LAST_MASTODON_ID: ${{ vars.JEFF_LAST_MASTODON_ID }}
          MASTODON_HANDLE: jeff_mclane@sportsbots.xyz
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_LIMIT: ${{ vars.POST_LIMIT }}
      - name: Save last Mastodon ID
        if: always() && steps.jeff.outputs.last_mastodon_id != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LAST_MASTODON_ID: ${{ steps.jeff.outputs.last_mastodon_id }}
        run: gh variable set JEFF_LAST_MASTODON_ID --body "$LAST_MASTODON_ID" --repo "$GITHUB_REPOSITORY"
