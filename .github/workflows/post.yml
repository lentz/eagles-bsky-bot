name: "Post to Bluesky"

on:
  schedule:
    - cron: "30 */1 * * *"

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Send post
        id: send
        run: npm start
        env:
          BSKY_HANDLE: ${{ vars.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          LAST_MASTODON_ID: ${{ vars.LAST_MASTODON_ID }}
          MASTODON_HANDLE: ${{ vars.MASTODON_HANDLE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          POST_LIMIT: ${{ vars.POST_LIMIT }}
      - name: Save last Mastodon ID
        if: always() && steps.send.outputs.last_mastodon_id != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LAST_MASTODON_ID: ${{ steps.send.outputs.last_mastodon_id }}
        run: gh variable set LAST_MASTODON_ID --body "$LAST_MASTODON_ID" --repo "$GITHUB_REPOSITORY"
